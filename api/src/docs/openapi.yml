openapi: 3.0.3
info:
  title: Kevbot API
  version: "1.0.0"
servers:
  - url: http://localhost:3000/v1
paths:
  /library/pools:
    get:
      summary: List entries from an explicitly typed library source.
      description: Pagination defaults to 25 entries (maximum 100). Playlist sources use playlist_id, never a playlist name. all_tracks and my_uploads can be paged through in full. play_history preserves repeated events; unavailable references remain visible with an explanation. my_uploads requires a resolved actor.
      parameters:
        - in: query
          name: source
          required: true
          schema:
            type: string
            enum: [all_tracks, playlist, most_played, my_uploads, play_history, upload_history]
          description: Source type. Use playlist_id when source is playlist.
        - in: query
          name: playlist_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page with total count and stable ordering.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /library/pools/random:
    get:
      summary: Select one random eligible track from an explicitly typed source.
      description: Filters availability and tracks shorter than max_duration before random selection. most_played, play_history, and upload_history first apply their requested window (default 25, maximum 100); other sources use their complete eligible set. Playlist selection is by playlist_id, so names never collide with special source types. The response returns the exact source object to forward when reporting playback.
      parameters:
        - in: query
          name: source
          required: true
          schema:
            type: string
            enum: [all_tracks, playlist, most_played, my_uploads, play_history, upload_history]
          description: Source type. Use playlist_id when source is playlist.
        - in: query
          name: playlist_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: max_duration
          schema:
            type: number
            maximum: 15
      responses:
        "200":
          description: A selected track, explicit source, and optional play-history event reference.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /plays/events:
    post:
      summary: Report a successfully started playback idempotently.
      description: Accepts anonymous requests, authenticated browser users, or delegated bot actors. A supplied invalid token is rejected. Generate event_id once per attempted playback and reuse it for retries. Anonymous events remain in history but do not affect play totals, per-type counts, or most-played rankings. Use a named play_type and, for random selection, forward the source returned by the random-pool endpoint. playlist_greeting requires a playlist source. The event record, track history/counters, and optional playlist-play record commit atomically. The API trusts the caller's playback_started assertion; it cannot prove that audio was audible.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, track_id, play_type, playback_started]
              properties:
                event_id:
                  type: string
                  format: uuid
                track_id:
                  type: integer
                  minimum: 1
                play_type:
                  type: string
                  enum: [play, random, greeting, raid, farewell, playlist_greeting]
                source:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [type]
                      properties:
                        type:
                          type: string
                          enum: [all_tracks, most_played, my_uploads, play_history, upload_history]
                    - type: object
                      additionalProperties: false
                      required: [type, playlist_id]
                      properties:
                        type:
                          type: string
                          enum: [playlist]
                        playlist_id:
                          type: integer
                          minimum: 1
                playback_started:
                  type: boolean
                  enum: [true]
      responses:
        "201":
          description: The first event report was recorded.
        "200":
          description: This exact event report was already recorded.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bot/auth:
    post:
      summary: Authenticate the trusted bot service (not an acting user).
      parameters:
        - in: header
          name: x-bot-key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Short-lived service Bearer token; cannot mutate actor resources.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bot/actors/resolve:
    post:
      summary: Resolve or provision an acting Discord user (bot service only).
      description: Website and delegated actor tokens are forbidden. Snowflakes are strings, never numbers. The resulting bot actor token is usable on ordinary authenticated endpoints and creates no refresh cookie/session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [discord_id]
              properties:
                discord_id:
                  type: string
                  pattern: '^[1-9]\d{16,19}$'
      responses:
        "200":
          description: Resolved user and signed acting-user access token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, role, user]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                  role:
                    type: string
                    enum: [bot]
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/login:
    post:
      summary: Login a user and return a JWT token
      requestBody:
        description: User credentials for login.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        "200":
          description: Successful login returning a JWT token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/register:
    post:
      summary: Register a new user.
      requestBody:
        description: User details for registration.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        "201":
          description: New user created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /users:
    get:
      summary: Retrieve a list of users.
      parameters:
        - in: query
          name: username
          schema:
            type: string
          description: Filter by username.
        - in: query
          name: discordId
          schema:
            type: string
          description: Filter by discord id.
        - in: query
          name: discordUsername
          schema:
            type: string
          description: Filter by discord username.
      responses:
        "200":
          description: A list of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"

  /users/@me:
    get:
      summary: Retrieve the currently authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Update the currently authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        description: Fields to update (e.g. username).
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/@me/greeting:
    get:
      summary: Get greeting settings for the current user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Greeting settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salutation"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Update greeting settings for the current user.
      security:
        - bearerAuth: []
      requestBody:
        description: Greeting settings. Provide either a track or playlist (but not both).
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    greeting_track_id:
                      type: integer
                    greeting_playlist_id:
                      nullable: true
                      type: integer
                  required:
                    - greeting_track_id
                - type: object
                  properties:
                    greeting_playlist_id:
                      type: integer
                    greeting_track_id:
                      nullable: true
                      type: integer
                  required:
                    - greeting_playlist_id
      responses:
        "200":
          description: Updated greeting settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salutation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/@me/farewell:
