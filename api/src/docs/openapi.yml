  /audio/normalize:
    post:
      summary: Normalize an audio upload without adding it to the library.
      description: |
        Uses the same bearer authentication, validation and two-pass FFmpeg
        normalization as track uploads. Send exactly one file under `file`, with
        no track name or other form fields. Only the case-sensitive `.mp3`
        extension and actual MP3 audio are supported; MIME type alone is not proof.
        Maximum file size is 3,000,000 bytes (inclusive). Probed input duration
        must be positive and strictly less than 15 seconds, including encoder
        padding (accepted parity decision D3).

        Targets -16 LUFS integrated loudness and maximum -1.5 dBTP true peak.
        Output is verified within +/-2.5 LUFS of the target, at or below -1.5 dBTP,
        and within 0.01 seconds of the input's probed duration. Unverifiable output
        is a processing failure, not a successful download.

        Returns MP3 bytes directly. No database/library, permanent object storage,
        playlist or playback writes occur. Each request has its own temporary
        directory, removed after streaming finishes or processing stops on error
        or disconnect. A failure after response streaming starts closes the
        connection; clients must treat an incomplete download as a failure.

        Example: `curl --fail --show-error -H "Authorization: Bearer $ACCESS_TOKEN" -F "file=@clip.mp3" http://localhost:3000/v1/audio/normalize --output clip-normalized.mp3`
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: MP3 audio, at most 3,000,000 bytes and strictly less than 15 seconds.
            encoding:
              file:
                contentType: audio/mpeg
      responses:
        "200":
          description: Playable, verified normalized MP3 binary.
          headers:
            Content-Disposition:
              description: Attachment with sanitized basename, at most 80 stem characters, suffixed with -normalized.mp3.
              schema:
                type: string
                example: 'attachment; filename="clip-normalized.mp3"'
            Content-Length:
              description: Number of bytes in the completed MP3.
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Missing file, malformed multipart, extra file/field, unsupported extension/content, corrupt audio or duration limit violation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          description: Normalization, output metadata, loudness/peak verification, duration-preservation or local I/O failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tracks:
    get:
      summary: Retrieve a paginated list of tracks.
      description: |
        Returns tracks sorted by `created_at` descending. For search/relevance
        ranking across tracks, playlists, and users, use `GET /search`.
      parameters:
        - in: query
          name: include_deleted
          schema:
            type: boolean
            default: false
          description: Whether to include soft-deleted tracks in results.
        - in: query
          name: user_id
          schema:
            type: integer
            minimum: 1
          description: Narrow results to tracks owned by this user.
        - in: query
          name: playlist_id
          schema:
            type: integer
            minimum: 1
          description: Narrow results to tracks belonging to this playlist.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of tracks to return per page.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of tracks to skip for pagination.
      responses:
        "200":
          description: A paginated list of tracks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTracksResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      summary: Upload a new track.
      description: |
        Uses the same MP3 validation and normalization as `/audio/normalize`:
        at most 3,000,000 bytes and a positive probed duration strictly less than
        15 seconds (accepted parity decision D3). Existing tracks are not modified.
      security:
        - bearerAuth: []
      requestBody:
        description: Multipart form data with track name and file.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                file:
                  type: string
                  format: binary
              required:
                - name
                - file
      responses:
        "201":
          description: Track uploaded successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /tracks/{id}:
    get:
      summary: Retrieve a track by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: A track object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a track's name.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        description: New track name.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        "200":
          description: Updated track.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Soft delete a track.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Deleted track object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{id}/restore:
    patch:
      summary: Restore a deleted track (optionally renaming it).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        description: Optional new name for the restored track.
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Restored track.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tracks/{id}/download:
    get:
      summary: Download a track.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: MP3 file as attachment.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /tracks/{id}/stream:
    get:
      summary: Stream a track with support for range requests.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - in: header
          name: Range
          schema:
            type: string
          description: Byte range header.
      responses:
        "200":
          description: Full track stream.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "416":
          description: Requested Range Not Satisfiable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /playlists:
    get:
      summary: Retrieve a list of playlists.
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Filter by playlist name.
        - in: query
          name: include_deleted
          schema:
            type: boolean
          description: Whether to include deleted playlists.
      responses:
        "200":
          description: A list of playlists.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      summary: Create a new playlist.
      description: Any authenticated actor. Lowercase ASCII letters/digits, maximum 45 characters. Playlist names are independent of library source types; no names are reserved.
      security:
        - bearerAuth: []
      requestBody:
        description: Playlist creation data.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        "201":
          description: Playlist created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /playlists/{id}:
    get:
      summary: Get a playlist by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: A playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update a playlist (e.g. change its name).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        description: New playlist data.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        "200":
          description: Updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Soft delete a playlist.
      description: Creator or configured master only. The playlist must have no memberships (409 otherwise).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Deleted playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /playlists/{id}/restore:
    patch:
      summary: Restore a soft-deleted playlist.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        description: Optional new name when restoring.
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Restored playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /playlists/{id}/tracks:
    post:
      summary: Add tracks to a playlist.
      description: Any authenticated actor may add nondeleted tracks to an active playlist.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        description: An array of track IDs to add.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                track_ids:
                  type: array
                  items:
                    type: integer
              required:
                - track_ids
      responses:
        "201":
          description: Tracks added to the playlist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist_id:
                    type: integer
                  added_track_ids:
                    type: array
                    items:
                      type: integer
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      summary: Get all tracks in a playlist.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: List of tracks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove tracks from a playlist.
      description: Creator or configured master only; active playlists only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        description: An array of track IDs to remove.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                track_ids:
                  type: array
                  items:
                    type: integer
              required:
                - track_ids
      responses:
        "200":
          description: Tracks removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_track_ids:
                    type: array
                    items:
                      type: integer
                  not_in_playlist_track_ids:
                    type: array
                    items:
                      type: integer
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /search:
    get:
      summary: Unified search across tracks, playlists, and users.
      description: |
        A single endpoint that supports both **search mode** (when `q` is
        provided) and **browse mode** (when `q` is omitted) across the three
        entity types. Results are returned as a discriminated-union list with
        unified pagination. See `specs/search.md` for the full v1 spec.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
            minLength: 1
          description: Search query. Must be non-empty after trim if provided.
        - in: query
          name: type
          schema:
            type: string
            enum: [all, tracks, playlists, users]
            default: all
          description: Entity types to search.
        - in: query
          name: sort
          schema:
            type: string
            enum: [relevance, name, created_at, play_count]
          description: |
            Sort field. Defaults to `relevance` when `q` is provided, `name`
            otherwise. `relevance` requires `q`. `play_count` requires
            `type=tracks`.
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
          description: |
            Sort direction. Defaults to `asc` for `name`, `desc` for other
            sorts.
        - in: query
          name: include_deleted
          schema:
            type: boolean
            default: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: playlist_id
          schema:
            type: integer
            minimum: 1
          description: Narrow to a playlist. Valid only with `type=tracks`.
        - in: query
          name: user_id
          schema:
            type: integer
            minimum: 1
          description: Narrow to an owner. Valid only with `type=tracks` or `type=playlists`.
      responses:
        "200":
          description: Unified search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /docs:
    get:
      summary: API documentation page.
      responses:
        "200":
          description: Swagger UI HTML
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        discord_id:
          type: string
          nullable: true
        discord_username:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Track:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        user_id:
          type: integer
        duration:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        raw_total_play_count:
          type: integer
        total_play_count:
          type: integer
    UnifiedSearchUser:
      type: object
      properties:
        id:
          type: integer
        display_name:
          type: string
          nullable: true
      required:
        - id
        - display_name
    UnifiedSearchItemBase:
      type: object
      properties:
        type:
          type: string
          enum: [track, playlist, user]
        id:
          type: integer
        name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        relevance:
          type: number
          nullable: true
      required:
        - type
        - id
        - name
        - created_at
        - deleted_at
        - relevance
    UnifiedSearchTrack:
      allOf:
        - $ref: "#/components/schemas/UnifiedSearchItemBase"
        - type: object
          properties:
            type:
              type: string
              enum: [track]
            duration:
              type: number
            total_play_count:
              type: integer
            raw_total_play_count:
              type: integer
            user:
              $ref: "#/components/schemas/UnifiedSearchUser"
          required:
            - duration
            - total_play_count
            - raw_total_play_count
            - user
    UnifiedSearchPlaylist:
      allOf:
        - $ref: "#/components/schemas/UnifiedSearchItemBase"
        - type: object
          properties:
            type:
              type: string
              enum: [playlist]
            track_count:
              type: integer
            user:
              $ref: "#/components/schemas/UnifiedSearchUser"
          required:
            - track_count
            - user
    UnifiedSearchUserResult:
      allOf:
        - $ref: "#/components/schemas/UnifiedSearchItemBase"
        - type: object
          properties:
            type:
              type: string
              enum: [user]
    UnifiedSearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/UnifiedSearchTrack"
              - $ref: "#/components/schemas/UnifiedSearchPlaylist"
              - $ref: "#/components/schemas/UnifiedSearchUserResult"
            discriminator:
              propertyName: type
              mapping:
                track: "#/components/schemas/UnifiedSearchTrack"
                playlist: "#/components/schemas/UnifiedSearchPlaylist"
                user: "#/components/schemas/UnifiedSearchUserResult"
        pagination:
          type: object
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
            has_next:
              type: boolean
            has_prev:
              type: boolean
          required:
            - total
            - limit
            - offset
            - has_next
            - has_prev
      required:
        - data
        - pagination
    PaginatedTracksResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        pagination:
          type: object
          properties:
            total:
              type: integer
              description: Total number of tracks available
            limit:
              type: integer
              description: Maximum number of tracks returned per page
            offset:
              type: integer
              description: Number of tracks skipped
            hasNext:
              type: boolean
              description: Whether there are more tracks available
            hasPrev:
              type: boolean
              description: Whether there are previous tracks available
          required:
            - total
            - limit
            - offset
            - hasNext
            - hasPrev
      required:
        - data
        - pagination
    Playlist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
    Salutation:
      type: object
      description: Either greeting or farewell settings.
      properties:
        greeting_track_id:
          type: integer
          nullable: true
        greeting_playlist_id:
          type: integer
          nullable: true
        farewell_track_id:
          type: integer
          nullable: true
        farewell_playlist_id:
          type: integer
          nullable: true
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
  responses:
    PayloadTooLarge:
      description: File exceeds the 3,000,000-byte limit. Both HTTP status and JSON statusCode are 413.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Bad Request – validation error or missing fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized – missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden – not permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict – duplicate resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
