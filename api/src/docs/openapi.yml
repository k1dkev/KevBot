                      nullable: true
                      type: integer
                  required:
                    - farewell_track_id
                - type: object
                  properties:
                    farewell_playlist_id:
                      type: integer
                    farewell_track_id:
                      nullable: true
                      type: integer
                  required:
                    - farewell_playlist_id
      responses:
        "200":
