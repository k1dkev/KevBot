name: "[Database] Migrate"

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: environment
        description: Select the protected GitHub environment
      migration_version:
        required: true
        type: string
        description: Explicit major.minor.patch target, or latest
        default: latest
      dry_run:
        type: boolean
        description: Plan only; do not apply SQL
        default: true
      verify_tls:
        type: boolean
        description: Verify server TLS using MYSQL_SSL_CA_CERT (disable only for an explicitly approved non-TLS target)
        default: true

permissions:
  contents: read

concurrency:
  group: database-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Build migration manager
        run: docker build -t migration-manager:workflow tools/db/migration_manager
      - name: Run migration
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          MYSQL_SSL_CA_CERT: ${{ secrets.MYSQL_SSL_CA_CERT }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERIFY_TLS: ${{ inputs.verify_tls }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DB_CONNECTION_STRING" || { echo "Missing DB_CONNECTION_STRING secret" >&2; exit 1; }
          args=(migrate /migration --version "$MIGRATION_VERSION")
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          docker_args=(--rm -e DB_CONNECTION_STRING --mount "type=bind,source=$GITHUB_WORKSPACE/db/migration,target=/migration,readonly")
          if [[ "$VERIFY_TLS" == true ]]; then
            test -n "$MYSQL_SSL_CA_CERT" || { echo "Verified TLS requires MYSQL_SSL_CA_CERT" >&2; exit 1; }
            ca_file="$RUNNER_TEMP/migration-mysql-ca.pem"
            trap 'rm -f "$ca_file"' EXIT
            umask 077
            printf '%s\n' "$MYSQL_SSL_CA_CERT" > "$ca_file"
            docker_args+=(--mount "type=bind,source=$ca_file,target=/run/secrets/mysql-ca.pem,readonly" -e MYSQL_SSL_CA=/run/secrets/mysql-ca.pem)
          fi
          docker run "${docker_args[@]}" migration-manager:workflow "${args[@]}"
