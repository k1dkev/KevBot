name: Continuos Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  migration_manager_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
        working-directory: tools/db/migration_manager
      - run: python -m unittest discover -s tests -p test_cli.py
        working-directory: tools/db/migration_manager
      - run: docker build -t migration-manager:check tools/db/migration_manager
      - run: python -m unittest discover -s tests -p test_integration.py
        working-directory: tools/db/migration_manager

  frontend_checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4301
      NEXT_PUBLIC_FRONTEND_URL: http://127.0.0.1:4300
      NEXT_PUBLIC_DISCORD_OAUTH2_CLIENT_ID: build-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: CHECK_LOGGING_BUNDLE=1 npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-results
          path: frontend/test-results
          if-no-files-found: ignore

  run_api_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - name: Build docker image for migration manager
        run: |
          cd $GITHUB_WORKSPACE/tools/db/migration_manager
          docker build -t migration-manager .
      - name: Build docker image for api tests
        run: |
          docker build --target test -t kevbot_api_test .
      - name: Build clean production API image
        run: docker build --target production -t kevbot_api_production:smoke .
      - name: Smoke test production API image
        run: |
          docker run --rm \
          --network host \
          -v ./../db/migration:/db/migration:ro \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -e DOCKER_HOST=unix:///var/run/docker.sock \
          --entrypoint npm kevbot_api_test run test:production
      - name: Run tests
        run: |
          docker run --rm \
          --network host \
          -v ./../db/migration:/db/migration \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -e DOCKER_HOST=unix:///var/run/docker.sock \
          kevbot_api_test
      - name: Run focused logging tests
        run: docker run --rm --entrypoint npm kevbot_api_test run test:logging
