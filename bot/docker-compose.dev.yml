services:
  bot:
    profiles: [bot]
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    environment:
      NODE_ENV: development
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      COMMAND_PREFIX: ${COMMAND_PREFIX:-kb}
      API_BASE_URL: ${BOT_API_BASE_URL:-http://api:3000}
      BOT_AUTH_API_KEY: ${BOT_AUTH_API_KEY:-}
      LOG_LEVEL: ${BOT_LOG_LEVEL:-info}
    volumes:
      - .:/bot
      - /bot/node_modules
    stop_grace_period: 15s
